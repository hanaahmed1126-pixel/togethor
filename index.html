<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together 3D - Roblox Co-Op Escape</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #lobby {
            background: #101420;
            padding: 32px;
            border-radius: 20px;
            border: 2px solid #232d42;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0, 210, 255, 0.25);
            max-width: 440px;
            width: 90%;
            z-index: 10;
        }
        h1 {
            font-size: 32px;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #00d2ff, #3a86ff, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 900;
        }
        .btn {
            background: #00d2ff;
            color: #05070a;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            margin: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
        .btn:hover { background: #33e0ff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5); }
        .btn:active { transform: translateY(1px); }
        input {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #232d42;
            background: #05070a;
            color: #fff;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            width: 80%;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus { border-color: #00d2ff; }
        #game-container { display: none; flex-direction: column; align-items: center; position: relative; }
        #hud {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
            width: 860px;
            max-width: 95vw;
            font-size: 16px;
            font-weight: bold;
            z-index: 5;
            background: rgba(16, 20, 32, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }
        #canvas3d {
            border: 3px solid #232d42;
            border-radius: 16px;
            box-shadow: 0px 16px 50px rgba(0, 0, 0, 0.9);
        }
        #status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: 800;
            color: #ffbe0b;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 5;
            background: rgba(16, 20, 32, 0.85);
            padding: 8px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }
        .badge { padding: 6px 12px; border-radius: 8px; font-weight: 800; letter-spacing: 1px; }
        .p1-badge { background: #3a86ff; color: #fff; box-shadow: 0 0 10px rgba(58, 134, 255, 0.5); }
        .p2-badge { background: #ff006e; color: #fff; box-shadow: 0 0 10px rgba(255, 0, 110, 0.5); }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>TOGETHER 3D</h1>
        <p style="color: #8a99ad; font-size: 14px; margin-bottom: 24px; font-weight: 600;">ROBLOX-STYLE 3D ESCAPE ROOMS</p>
        
        <button class="btn" onclick="createRoom()">Create Room (P1)</button>
        <div style="margin: 14px 0; color: #3a4763; font-weight: 900;">OR</div>
        <input type="text" id="join-code" placeholder="4-DIGIT CODE" maxlength="4">
        <button class="btn" style="background:#ff006e; color:#fff; box-shadow: 0 4px 15px rgba(255,0,110,0.3);" onclick="joinRoom()">Join Room (P2)</button>

        <p id="lobby-status" style="margin-top: 18px; color: #ffbe0b; font-size: 15px; font-weight: 700;"></p>
    </div>

    <div id="game-container">
        <div id="hud">
            <div><span id="role-badge" class="badge"></span></div>
            <div style="color: #00d2ff;">🏰 ROOM: <span id="room-num">1</span>/4</div>
            <div style="color: #ffbe0b;">💎 GEMS: <span id="score">0</span></div>
            <div style="color: #a855f7;">🤝 TEAMWORK: <span id="teamwork-rank">S+</span></div>
        </div>
        <canvas id="canvas3d"></canvas>
        <div id="status">Work together to unlock the exits!</div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'gem') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'door') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                osc.start(); osc.stop(audioCtx.currentTime + 0.45);
            }
        }

        const lobbyEl = document.getElementById("lobby");
        const gameContainer = document.getElementById("game-container");
        const lobbyStatus = document.getElementById("lobby-status");
        const statusEl = document.getElementById("status");
        const roleBadge = document.getElementById("role-badge");
        const roomNumEl = document.getElementById("room-num");
        const scoreEl = document.getElementById("score");
        const rankEl = document.getElementById("teamwork-rank");

        let peer = null, conn = null, myRole = null;
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        let p2Inputs = {};
        let score = 0, deaths = 0, currentLevel = 0;

        function createRoom() {
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer("together-3d-" + roomCode);

            peer.on('open', () => {
                myRole = 'p1';
                lobbyStatus.innerText = `Room Ready! Code: ${roomCode}`;
            });
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        }

        function joinRoom() {
            const code = document.getElementById("join-code").value.trim();
            if (!code) return alert("Enter code!");

            peer = new Peer();
            peer.on('open', () => {
                myRole = 'p2';
                conn = peer.connect("together-3d-" + code);
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                lobbyEl.style.display = 'none';
                gameContainer.style.display = 'flex';
                
                if (myRole === 'p1') {
                    roleBadge.innerText = "P1 (BLUE)";
                    roleBadge.className = "badge p1-badge";
                } else {
                    roleBadge.innerText = "P2 (PINK)";
                    roleBadge.className = "badge p2-badge";
                }
                init3D();
                loadLevel(0);
                requestAnimationFrame(gameLoop);
            });

            conn.on('data', (data) => {
                if (myRole === 'p2' && data.gameState) syncGameState(data.gameState);
                if (myRole === 'p1' && data.inputs) p2Inputs = data.inputs;
            });
        }

        // 4 GUARANTEED SOLVABLE 3D LEVELS
        const levels = [
            // ROOM 1
            {
                p1Start: { x: -14, z: -6 }, p2Start: { x: -14, z: 6 },
                walls: [{ x: 0, z: 0, w: 32, d: 0.4 }, { x: -1, z: -9, w: 0.5, d: 6 }, { x: -1, z: 9, w: 0.5, d: 6 }],
                hazards: [],
                plates: [
                    { x: -7, z: -6, w: 2, d: 2, color: 0x3a86ff, targetDoor: 1, active: false },
                    { x: -7, z: 6, w: 2, d: 2, color: 0xff006e, targetDoor: 0, active: false }
                ],
                doors: [
                    { x: -1, z: -3, w: 0.5, d: 6, color: 0xff006e, open: false, progress: 0 },
                    { x: -1, z: 3, w: 0.5, d: 6, color: 0x3a86ff, open: false, progress: 0 }
                ],
                gems: [{ x: -10, z: -6, taken: false }, { x: 5, z: 6, taken: false }],
                exits: [{ x: 14, z: -6, w: 2, d: 4 }, { x: 14, z: 6, w: 2, d: 4 }]
            },
            // ROOM 2
            {
                p1Start: { x: -14, z: -6 }, p2Start: { x: -14, z: 6 },
                walls: [{ x: 0, z: 0, w: 32, d: 0.4 }, { x: -6, z: -6, w: 0.5, d: 6 }, { x: 5, z: 6, w: 0.5, d: 6 }],
                hazards: [],
                plates: [
                    { x: -10, z: -6, w: 2, d: 2, color: 0x3a86ff, targetDoor: 1, active: false },
                    { x: -2, z: 6, w: 2, d: 2, color: 0xff006e, targetDoor: 0, active: false }
                ],
                doors: [
                    { x: 5, z: -6, w: 0.5, d: 6, color: 0xff006e, open: false, progress: 0 },
                    { x: -6, z: 6, w: 0.5, d: 6, color: 0x3a86ff, open: false, progress: 0 }
                ],
                gems: [{ x: 0, z: -6, taken: false }, { x: 10, z: 6, taken: false }],
                exits: [{ x: 14, z: -6, w: 2, d: 4 }, { x: 14, z: 6, w: 2, d: 4 }]
            },
            // ROOM 3
            {
                p1Start: { x: -14, z: -6 }, p2Start: { x: -14, z: 6 },
                walls: [{ x: 0, z: 0, w: 32, d: 0.4 }, { x: -3, z: -6, w: 0.5, d: 6 }, { x: 4, z: 6, w: 0.5, d: 6 }],
                hazards: [
                    { x: -8, z: -6, vx: 0.12, minX: -11, maxX: -4, radius: 0.6 },
                    { x: 2, z: 6, vx: -0.12, minX: -2, maxX: 8, radius: 0.6 }
                ],
                plates: [
                    { x: -5, z: -6, w: 2, d: 2, color: 0x3a86ff, targetDoor: 1, active: false },
                    { x: -5, z: 6, w: 2, d: 2, color: 0xff006e, targetDoor: 0, active: false }
                ],
                doors: [
                    { x: 4, z: -6, w: 0.5, d: 6, color: 0xff006e, open: false, progress: 0 },
                    { x: -3, z: 6, w: 0.5, d: 6, color: 0x3a86ff, open: false, progress: 0 }
                ],
                gems: [{ x: 0, z: -6, taken: false }, { x: 10, z: 6, taken: false }],
                exits: [{ x: 14, z: -6, w: 2, d: 4 }, { x: 14, z: 6, w: 2, d: 4 }]
            },
            // ROOM 4
            {
                p1Start: { x: -14, z: -7 }, p2Start: { x: -14, z: 5 },
                walls: [
                    { x: 0, z: 0, w: 32, d: 0.4 },
                    { x: -8, z: -6, w: 0.5, d: 6 }, { x: 2, z: -6, w: 0.5, d: 6 },
                    { x: -4, z: 6, w: 0.5, d: 6 }, { x: 6, z: 6, w: 0.5, d: 6 }
                ],
                hazards: [
                    { x: -3, z: -6, vx: 0.15, minX: -6, maxX: 0, radius: 0.6 },
                    { x: 8, z: -6, vx: -0.15, minX: 4, maxX: 11, radius: 0.6 },
                    { x: 1, z: 6, vx: 0.15, minX: -2, maxX: 4, radius: 0.6 }
                ],
                plates: [
                    { x: -11, z: -6, w: 2, d: 2, color: 0x3a86ff, targetDoor: 1, active: false },
                    { x: -8, z: 6, w: 2, d: 2, color: 0xff006e, targetDoor: 0, active: false }
                ],
                doors: [
                    { x: 2, z: -6, w: 0.5, d: 6, color: 0xff006e, open: false, progress: 0 },
                    { x: 6, z: 6, w: 0.5, d: 6, color: 0x3a86ff, open: false, progress: 0 }
                ],
                gems: [{ x: -4, z: -6, taken: false }, { x: 10, z: 6, taken: false }],
                exits: [{ x: 14, z: -6, w: 2, d: 4 }, { x: 14, z: 6, w: 2, d: 4 }]
            }
        ];

        // THREE.JS ENGINE SETUP
        let scene, camera, renderer;
        let p1Mesh, p2Mesh;
        let wallGroup, plateMeshes = [], doorMeshes = [], hazardMeshes = [], gemMeshes = [], exitMeshes = [];

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e17);

            camera = new THREE.PerspectiveCamera(45, 800 / 500, 0.1, 1000);
            camera.position.set(0, 28, 22);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("canvas3d"), antialias: true });
            renderer.setSize(800, 500);
            renderer.shadowMap.enabled = true;

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 30, 20);
            sun.castShadow = true;
            scene.add(sun);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(34, 24);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x121824, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Players
            const playerGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            
            p1Mesh = new THREE.Mesh(playerGeo, new THREE.MeshStandardMaterial({ color: 0x3a86ff, roughness: 0.3, metalness: 0.2 }));
            p1Mesh.castShadow = true;
            scene.add(p1Mesh);

            p2Mesh = new THREE.Mesh(playerGeo, new THREE.MeshStandardMaterial({ color: 0xff006e, roughness: 0.3, metalness: 0.2 }));
            p2Mesh.castShadow = true;
            scene.add(p2Mesh);

            wallGroup = new THREE.Group();
            scene.add(wallGroup);
        }

        class Player3D {
            constructor(mesh) {
                this.mesh = mesh;
                this.x = 0; this.z = 0;
                this.speed = 0.18;
                this.size = 1.2;
            }

            move(inputKeys) {
                let dx = 0, dz = 0;
                if (inputKeys["KeyW"] || inputKeys["ArrowUp"]) dz -= this.speed;
                if (inputKeys["KeyS"] || inputKeys["ArrowDown"]) dz += this.speed;
                if (inputKeys["KeyA"] || inputKeys["ArrowLeft"]) dx -= this.speed;
                if (inputKeys["KeyD"] || inputKeys["ArrowRight"]) dx += this.speed;

                this.x += dx;
                if (this.checkCollision()) this.x -= dx;
                this.z += dz;
                if (this.checkCollision()) this.z -= dz;

                this.mesh.position.set(this.x, 0.6, this.z);
            }

            checkCollision() {
                if (Math.abs(this.x) > 16 || Math.abs(this.z) > 11) return true;

                const lvl = levels[currentLevel];
                for (let w of lvl.walls) {
                    if (Math.abs(this.x - w.x) < (w.w / 2 + 0.6) && Math.abs(this.z - w.z) < (w.d / 2 + 0.6)) return true;
                }
                for (let d of lvl.doors) {
                    if (d.progress < 0.85 && Math.abs(this.x - d.x) < (d.w / 2 + 0.6) && Math.abs(this.z - d.z) < (d.d / 2 + 0.6)) return true;
                }
                return false;
            }

            intersects(obj) {
                return Math.abs(this.x - obj.x) < (obj.w / 2 + 0.6) && Math.abs(this.z - obj.z) < (obj.d / 2 + 0.6);
            }
        }

        let p1, p2;

        function loadLevel(index) {
            currentLevel = index;
            const lvl = levels[currentLevel];

            if (!p1) {
                p1 = new Player3D(p1Mesh);
                p2 = new Player3D(p2Mesh);
            }

            p1.x = lvl.p1Start.x; p1.z = lvl.p1Start.z;
            p2.x = lvl.p2Start.x; p2.z = lvl.p2Start.z;
            p1.mesh.position.set(p1.x, 0.6, p1.z);
            p2.mesh.position.set(p2.x, 0.6, p2.z);

            // Rebuild 3D Meshes
            while (wallGroup.children.length > 0) wallGroup.remove(wallGroup.children[0]);
            plateMeshes = []; doorMeshes = []; hazardMeshes = []; gemMeshes = []; exitMeshes = [];

            // Outer Bounds Walls
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x232d42, roughness: 0.5 });
            lvl.walls.forEach(w => {
                const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, 2.5, w.d), wallMat);
                wallMesh.position.set(w.x, 1.25, w.z);
                wallMesh.castShadow = true; wallMesh.receiveShadow = true;
                wallGroup.add(wallMesh);
            });

            // Plates
            lvl.plates.forEach(p => {
                p.active = false;
                const plateMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(p.w, 0.2, p.d),
                    new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.3 })
                );
                plateMesh.position.set(p.x, 0.1, p.z);
                wallGroup.add(plateMesh);
                plateMeshes.push(plateMesh);
            });

            // Doors
            lvl.doors.forEach(d => {
                d.open = false; d.progress = 0;
                const doorMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(d.w, 2.5, d.d),
                    new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.2, metalness: 0.5 })
                );
                doorMesh.position.set(d.x, 1.25, d.z);
                wallGroup.add(doorMesh);
                doorMeshes.push(doorMesh);
            });

            // Hazards
            lvl.hazards.forEach(h => {
                const hazMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(h.radius, h.radius, 2, 16),
                    new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5 })
                );
                hazMesh.position.set(h.x, 1, h.z);
                wallGroup.add(hazMesh);
                hazardMeshes.push(hazMesh);
            });

            // Gems
            lvl.gems.forEach(g => {
                g.taken = false;
                const gemMesh = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.6),
                    new THREE.MeshStandardMaterial({ color: 0xffbe0b, emissive: 0xffbe0b, emissiveIntensity: 0.4 })
                );
                gemMesh.position.set(g.x, 1, g.z);
                wallGroup.add(gemMesh);
                gemMeshes.push(gemMesh);
            });

            // Exits
            lvl.exits.forEach(e => {
                const exitMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(e.w, 0.1, e.d),
                    new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00ff88, emissiveIntensity: 0.4 })
                );
                exitMesh.position.set(e.x, 0.05, e.z);
                wallGroup.add(exitMesh);
                exitMeshes.push(exitMesh);
            });
        }

        function calculateRank() {
            if (deaths === 0 && score >= 1500) return "S+ (FLAWLESS)";
            if (deaths <= 2) return "A (PRO CO-OP)";
            if (deaths <= 5) return "B (SOLID)";
            return "C (NEEDS WORK)";
        }

        function syncGameState(state) {
            currentLevel = state.currentLevel;
            p1.x = state.p1.x; p1.z = state.p1.z; p1.mesh.position.set(p1.x, 0.6, p1.z);
            p2.x = state.p2.x; p2.z = state.p2.z; p2.mesh.position.set(p2.x, 0.6, p2.z);
            levels[currentLevel].doors = state.doors;
            levels[currentLevel].plates = state.plates;
            levels[currentLevel].gems = state.gems;
            levels[currentLevel].hazards = state.hazards;
            score = state.score; deaths = state.deaths;
            statusEl.innerText = state.status;
            roomNumEl.innerText = currentLevel + 1;
            scoreEl.innerText = score;
            rankEl.innerText = calculateRank();
        }

        function update() {
            if (!p1) return;

            if (myRole === 'p1') {
                const lvl = levels[currentLevel];
                p1.move(keys);
                p2.move(p2Inputs);

                // Update Plates & 3D Doors
                lvl.plates.forEach((plate, i) => {
                    const activeNow = p1.intersects(plate) || p2.intersects(plate);
                    if (activeNow && !plate.active) playSound('door');
                    plate.active = activeNow;

                    plateMeshes[i].position.y = plate.active ? 0.02 : 0.1;
                    lvl.doors[plate.targetDoor].open = plate.active;
                });

                lvl.doors.forEach((door, i) => {
                    door.progress += (door.open ? 1 : -1) * 0.08;
                    door.progress = Math.max(0, Math.min(1, door.progress));
                    doorMeshes[i].position.y = 1.25 - (door.progress * 2.4);
                });

                // Update Hazards
                lvl.hazards.forEach((h, i) => {
                    h.x += h.vx;
                    if (h.x <= h.minX || h.x >= h.maxX) h.vx *= -1;
                    hazardMeshes[i].position.x = h.x;

                    // Hit test
                    if (Math.hypot(p1.x - h.x, p1.z - h.z) < h.radius + 0.6 ||
                        Math.hypot(p2.x - h.x, p2.z - h.z) < h.radius + 0.6) {
                        playSound('hit');
                        deaths++;
                        p1.x = lvl.p1Start.x; p1.z = lvl.p1Start.z;
                        p2.x = lvl.p2Start.x; p2.z = lvl.p2Start.z;
                        statusEl.innerText = "⚡ HIT A HAZARD! ROOM RESET!";
                    }
                });

                // Update Gems
                lvl.gems.forEach((gem, i) => {
                    gemMeshes[i].rotation.y += 0.04;
                    if (!gem.taken && (Math.hypot(p1.x - gem.x, p1.z - gem.z) < 1.2 || Math.hypot(p2.x - gem.x, p2.z - gem.z) < 1.2)) {
                        gem.taken = true;
                        gemMeshes[i].visible = false;
                        score += 300;
                        playSound('gem');
                    }
                });

                // Room Exit Progression
                if (p1.intersects(lvl.exits[0]) && p2.intersects(lvl.exits[1])) {
                    if (currentLevel + 1 < levels.length) {
                        playSound('win');
                        loadLevel(currentLevel + 1);
                        statusEl.innerText = `🎉 CLEARED ROOM ${currentLevel}! MOVING TO ROOM ${currentLevel + 1}`;
                    } else {
                        if (!statusEl.innerText.includes("VICTORY")) playSound('win');
                        statusEl.innerText = `🏆 ESCAPED ALL ROOMS! RANK: ${calculateRank()}`;
                    }
                }

                roomNumEl.innerText = currentLevel + 1;
                scoreEl.innerText = score;
                rankEl.innerText = calculateRank();

                if (conn && conn.open) {
                    conn.send({
                        gameState: {
                            currentLevel: currentLevel,
                            p1: { x: p1.x, z: p1.z }, p2: { x: p2.x, z: p2.z },
                            doors: lvl.doors, plates: lvl.plates, gems: lvl.gems, hazards: lvl.hazards,
                            score: score, deaths: deaths, status: statusEl.innerText
                        }
                    });
                }
            } else if (myRole === 'p2' && conn && conn.open) {
                conn.send({ inputs: keys });
            }
        }

        function gameLoop() {
            update();
            if (renderer && scene && camera) renderer.render(scene, camera);
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
