<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - Roblox-Style Co-Op</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #08090d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #lobby {
            background: #121624;
            padding: 32px;
            border-radius: 20px;
            border: 2px solid #2a344d;
            text-align: center;
            box-shadow: 0 10px 50px rgba(0, 210, 255, 0.2);
            max-width: 440px;
            width: 90%;
        }
        h1 {
            font-size: 32px;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #00d2ff, #0077ff, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 900;
        }
        .btn {
            background: #00d2ff;
            color: #08090d;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            margin: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
        .btn:hover { background: #33e0ff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5); }
        .btn:active { transform: translateY(1px); }
        input {
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #2a344d;
            background: #08090d;
            color: #fff;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            width: 80%;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus { border-color: #00d2ff; }
        #game-container { display: none; flex-direction: column; align-items: center; }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: bold;
        }
        canvas {
            border: 3px solid #2a344d;
            border-radius: 16px;
            box-shadow: 0px 16px 50px rgba(0, 0, 0, 0.9);
            background-color: #0f131d;
        }
        #status {
            margin-top: 14px;
            font-size: 18px;
            font-weight: 800;
            color: #ffbe0b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .badge { padding: 6px 12px; border-radius: 8px; font-weight: 800; letter-spacing: 1px; }
        .p1-badge { background: #0077ff; color: #fff; box-shadow: 0 0 10px rgba(0, 119, 255, 0.5); }
        .p2-badge { background: #ff006e; color: #fff; box-shadow: 0 0 10px rgba(255, 0, 110, 0.5); }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>TOGETHER</h1>
        <p style="color: #8a99ad; font-size: 14px; margin-bottom: 24px; font-weight: 600;">ROBLOX-STYLE ESCAPE ROOM GAUNTLET</p>
        
        <button class="btn" onclick="createRoom()">Create Room (P1)</button>
        <div style="margin: 14px 0; color: #3a4763; font-weight: 900;">OR</div>
        <input type="text" id="join-code" placeholder="4-DIGIT CODE" maxlength="4">
        <button class="btn" style="background:#ff006e; color:#fff; box-shadow: 0 4px 15px rgba(255,0,110,0.3);" onclick="joinRoom()">Join Room (P2)</button>

        <p id="lobby-status" style="margin-top: 18px; color: #ffbe0b; font-size: 15px; font-weight: 700;"></p>
    </div>

    <div id="game-container">
        <div id="hud">
            <div><span id="role-badge" class="badge"></span></div>
            <div style="color: #00d2ff;">🏰 ROOM: <span id="room-num">1</span>/4</div>
            <div style="color: #ffbe0b;">💎 GEMS: <span id="score">0</span></div>
            <div style="color: #a855f7;">🤝 TEAMWORK: <span id="teamwork-rank">S+</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="status">Work together to open the exits!</div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'gem') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'door') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                osc.start(); osc.stop(audioCtx.currentTime + 0.45);
            }
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const lobbyEl = document.getElementById("lobby");
        const gameContainer = document.getElementById("game-container");
        const lobbyStatus = document.getElementById("lobby-status");
        const statusEl = document.getElementById("status");
        const roleBadge = document.getElementById("role-badge");
        const roomNumEl = document.getElementById("room-num");
        const scoreEl = document.getElementById("score");
        const rankEl = document.getElementById("teamwork-rank");

        let peer = null, conn = null, myRole = null;
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        let p2Inputs = {};
        let score = 0, deaths = 0, currentLevel = 0;
        let particles = [], screenShake = 0, animTime = 0;

        function createRoom() {
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer("together-anim-" + roomCode);

            peer.on('open', () => {
                myRole = 'p1';
                lobbyStatus.innerText = `Room Created! Code: ${roomCode}`;
            });
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        }

        function joinRoom() {
            const code = document.getElementById("join-code").value.trim();
            if (!code) return alert("Enter code!");

            peer = new Peer();
            peer.on('open', () => {
                myRole = 'p2';
                conn = peer.connect("together-anim-" + code);
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                lobbyEl.style.display = 'none';
                gameContainer.style.display = 'flex';
                
                if (myRole === 'p1') {
                    roleBadge.innerText = "PLAYER 1 (BLUE)";
                    roleBadge.className = "badge p1-badge";
                } else {
                    roleBadge.innerText = "PLAYER 2 (PINK)";
                    roleBadge.className = "badge p2-badge";
                }
                loadLevel(0);
                requestAnimationFrame(gameLoop);
            });

            conn.on('data', (data) => {
                if (myRole === 'p2' && data.gameState) syncGameState(data.gameState);
                if (myRole === 'p1' && data.inputs) p2Inputs = data.inputs;
            });
        }

        const levels = [
            // ROOM 1
            {
                p1Start: { x: 50, y: 100 }, p2Start: { x: 50, y: 350 },
                walls: [{ x: 0, y: 245, w: 800, h: 10 }, { x: 380, y: 0, w: 20, h: 170 }, { x: 380, y: 255, w: 20, h: 170 }],
                hazards: [],
                plates: [
                    { x: 220, y: 100, w: 36, h: 36, color: "#0077ff", targetDoor: 1, active: false, pressProgress: 0 },
                    { x: 220, y: 350, w: 36, h: 36, color: "#ff006e", targetDoor: 0, active: false, pressProgress: 0 }
                ],
                doors: [
                    { x: 380, y: 170, w: 20, maxH: 75, h: 75, color: "#ff006e", open: false, slideProgress: 0 },
                    { x: 380, y: 255, w: 20, maxH: 75, h: 75, color: "#0077ff", open: false, slideProgress: 0 }
                ],
                gems: [{ x: 150, y: 110, taken: false, rot: 0 }, { x: 500, y: 350, taken: false, rot: 0 }],
                exits: [{ x: 720, y: 70, w: 50, h: 90 }, { x: 720, y: 320, w: 50, h: 90 }]
            },
            // ROOM 2
            {
                p1Start: { x: 50, y: 80 }, p2Start: { x: 50, y: 330 },
                walls: [{ x: 0, y: 245, w: 800, h: 10 }, { x: 250, y: 0, w: 20, h: 160 }, { x: 520, y: 80, w: 20, h: 165 }, { x: 350, y: 255, w: 20, h: 160 }],
                hazards: [],
                plates: [
                    { x: 140, y: 180, w: 36, h: 36, color: "#0077ff", targetDoor: 1, active: false, pressProgress: 0 },
                    { x: 280, y: 350, w: 36, h: 36, color: "#ff006e", targetDoor: 0, active: false, pressProgress: 0 }
                ],
                doors: [
                    { x: 520, y: 0, w: 20, maxH: 80, h: 80, color: "#ff006e", open: false, slideProgress: 0 },
                    { x: 350, y: 415, w: 20, maxH: 85, h: 85, color: "#0077ff", open: false, slideProgress: 0 }
                ],
                gems: [{ x: 320, y: 80, taken: false, rot: 0 }, { x: 620, y: 350, taken: false, rot: 0 }],
                exits: [{ x: 720, y: 70, w: 50, h: 90 }, { x: 720, y: 320, w: 50, h: 90 }]
            },
            // ROOM 3
            {
                p1Start: { x: 40, y: 100 }, p2Start: { x: 40, y: 350 },
                walls: [{ x: 0, y: 245, w: 800, h: 10 }, { x: 300, y: 0, w: 20, h: 150 }, { x: 550, y: 90, w: 20, h: 155 }, { x: 400, y: 255, w: 20, h: 160 }],
                hazards: [
                    { x: 180, y: 30, w: 14, h: 90, vy: 3.5, minY: 10, maxY: 140 },
                    { x: 450, y: 270, w: 14, h: 90, vy: -3.5, minY: 260, maxY: 380 }
                ],
                plates: [
                    { x: 200, y: 180, w: 36, h: 36, color: "#0077ff", targetDoor: 1, active: false, pressProgress: 0 },
                    { x: 220, y: 350, w: 36, h: 36, color: "#ff006e", targetDoor: 0, active: false, pressProgress: 0 }
                ],
                doors: [
                    { x: 550, y: 0, w: 20, maxH: 90, h: 90, color: "#ff006e", open: false, slideProgress: 0 },
                    { x: 400, y: 415, w: 20, maxH: 85, h: 85, color: "#0077ff", open: false, slideProgress: 0 }
                ],
                gems: [{ x: 400, y: 100, taken: false, rot: 0 }, { x: 580, y: 350, taken: false, rot: 0 }],
                exits: [{ x: 720, y: 70, w: 50, h: 90 }, { x: 720, y: 320, w: 50, h: 90 }]
            },
            // ROOM 4
            {
                p1Start: { x: 40, y: 60 }, p2Start: { x: 40, y: 300 },
                walls: [
                    { x: 0, y: 245, w: 800, h: 10 },
                    { x: 180, y: 0, w: 20, h: 150 }, { x: 380, y: 90, w: 20, h: 155 }, { x: 580, y: 0, w: 20, h: 150 },
                    { x: 280, y: 255, w: 20, h: 160 }, { x: 500, y: 340, w: 20, h: 160 }
                ],
                hazards: [
                    { x: 280, y: 30, w: 14, h: 85, vy: 4.5, minY: 10, maxY: 140 },
                    { x: 480, y: 30, w: 14, h: 85, vy: -4.5, minY: 10, maxY: 140 },
                    { x: 380, y: 270, w: 14, h: 85, vy: 4.5, minY: 260, maxY: 390 }
                ],
                plates: [
                    { x: 100, y: 180, w: 36, h: 36, color: "#0077ff", targetDoor: 1, active: false, pressProgress: 0 },
                    { x: 200, y: 350, w: 36, h: 36, color: "#ff006e", targetDoor: 0, active: false, pressProgress: 0 }
                ],
                doors: [
                    { x: 580, y: 150, w: 20, maxH: 95, h: 95, color: "#ff006e", open: false, slideProgress: 0 },
                    { x: 500, y: 255, w: 20, maxH: 85, h: 85, color: "#0077ff", open: false, slideProgress: 0 }
                ],
                gems: [{ x: 280, y: 180, taken: false, rot: 0 }, { x: 420, y: 350, taken: false, rot: 0 }, { x: 650, y: 100, taken: false, rot: 0 }],
                exits: [{ x: 720, y: 70, w: 50, h: 90 }, { x: 720, y: 320, w: 50, h: 90 }]
            }
        ];

        class AnimatedPlayer {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.size = 26; this.color = color;
                this.speed = 4;
                this.vx = 0; this.vy = 0;
                this.facing = { x: 1, y: 0 };
                this.walkCycle = 0;
            }

            move(inputKeys) {
                let dx = 0, dy = 0;
                if (inputKeys["KeyW"] || inputKeys["ArrowUp"]) dy -= this.speed;
                if (inputKeys["KeyS"] || inputKeys["ArrowDown"]) dy += this.speed;
                if (inputKeys["KeyA"] || inputKeys["ArrowLeft"]) dx -= this.speed;
                if (inputKeys["KeyD"] || inputKeys["ArrowRight"]) dx += this.speed;

                this.vx = dx; this.vy = dy;

                if (dx !== 0 || dy !== 0) {
                    this.facing = { x: dx, y: dy };
                    this.walkCycle += 0.25;
                } else {
                    this.walkCycle = 0;
                }

                this.x += dx;
                if (this.checkCollision()) this.x -= dx;
                this.y += dy;
                if (this.checkCollision()) this.y -= dy;
            }

            checkCollision() {
                const lvl = levels[currentLevel];
                if (this.x < 0 || this.x + this.size > canvas.width || 
                    this.y < 0 || this.y + this.size > canvas.height) return true;

                for (let wall of lvl.walls) if (this.intersects(wall)) return true;
                for (let door of lvl.doors) {
                    if (door.slideProgress < 0.85 && this.intersects({ x: door.x, y: door.y, w: door.w, h: door.maxH * (1 - door.slideProgress) })) return true;
                }
                return false;
            }

            intersects(rect) {
                return this.x < rect.x + (rect.w || rect.size) &&
                       this.x + this.size > rect.x &&
                       this.y < rect.y + (rect.h || rect.size) &&
                       this.y + this.size > rect.y;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);

                // Roblox Walking Squish / Bob Animation
                const bob = Math.sin(this.walkCycle) * 3;
                const scaleX = 1 + Math.sin(this.walkCycle) * 0.08;
                const scaleY = 1 - Math.sin(this.walkCycle) * 0.08;
                ctx.scale(scaleX, scaleY);

                // Shadow
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.ellipse(0, this.size / 2 - 2, this.size / 2, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Character Body
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.fillRect(-this.size / 2, -this.size / 2 + bob, this.size, this.size);
                ctx.shadowBlur = 0;

                // Glowing Eyes (Direction Facing)
                ctx.fillStyle = "#ffffff";
                let eyeX = (this.facing.x !== 0 ? Math.sign(this.facing.x) * 5 : 0);
                let eyeY = (this.facing.y !== 0 ? Math.sign(this.facing.y) * 5 : 0) + bob;
                ctx.fillRect(eyeX - 4, eyeY - 4, 4, 4);
                ctx.fillRect(eyeX + 2, eyeY - 4, 4, 4);

                ctx.restore();
            }
        }

        let p1 = new AnimatedPlayer(0, 0, "#0077ff");
        let p2 = new AnimatedPlayer(0, 0, "#ff006e");

        function loadLevel(index) {
            currentLevel = index;
            const lvl = levels[currentLevel];
            p1.x = lvl.p1Start.x; p1.y = lvl.p1Start.y;
            p2.x = lvl.p2Start.x; p2.y = lvl.p2Start.y;
            lvl.plates.forEach(p => { p.active = false; p.pressProgress = 0; });
            lvl.doors.forEach(d => { d.open = false; d.slideProgress = 0; });
            lvl.gems.forEach(g => g.taken = false);
        }

        function calculateRank() {
            if (deaths === 0 && score >= 1500) return "S+ (FLAWLESS)";
            if (deaths <= 2) return "A (PRO CO-OP)";
            if (deaths <= 5) return "B (SOLID)";
            return "C (TRY AGAIN)";
        }

        function spawnBurst(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: color, life: 20 + Math.random() * 10,
                    size: 3 + Math.random() * 4
                });
            }
        }

        function syncGameState(state) {
            currentLevel = state.currentLevel;
            p1.x = state.p1.x; p1.y = state.p1.y; p1.facing = state.p1.facing; p1.walkCycle = state.p1.walkCycle;
            p2.x = state.p2.x; p2.y = state.p2.y; p2.facing = state.p2.facing; p2.walkCycle = state.p2.walkCycle;
            levels[currentLevel].doors = state.doors;
            levels[currentLevel].plates = state.plates;
            levels[currentLevel].gems = state.gems;
            levels[currentLevel].hazards = state.hazards;
            score = state.score; deaths = state.deaths;
            statusEl.innerText = state.status;
            roomNumEl.innerText = currentLevel + 1;
            scoreEl.innerText = score;
            rankEl.innerText = calculateRank();
        }

        function update() {
            animTime += 0.05;

            if (myRole === 'p1') {
                const lvl = levels[currentLevel];
                p1.move(keys);
                p2.move(p2Inputs);

                // Animated Door Sliding & Plate Pressing
                lvl.plates.forEach((plate) => {
                    const activeNow = p1.intersects(plate) || p2.intersects(plate);
                    if (activeNow && !plate.active) {
                        playSound('door');
                        screenShake = 6;
                        spawnBurst(plate.x + 18, plate.y + 18, plate.color);
                    }
                    plate.active = activeNow;
                    plate.pressProgress += (plate.active ? 1 : -1) * 0.2;
                    plate.pressProgress = Math.max(0, Math.min(1, plate.pressProgress));
                    
                    lvl.doors[plate.targetDoor].open = plate.active;
                });

                lvl.doors.forEach(door => {
                    door.slideProgress += (door.open ? 1 : -1) * 0.1;
                    door.slideProgress = Math.max(0, Math.min(1, door.slideProgress));
                });

                // Hazards Movement & Collision
                lvl.hazards.forEach(h => {
                    h.y += h.vy;
                    if (h.y <= h.minY || h.y >= h.maxY) h.vy *= -1;

                    if (p1.intersects(h) || p2.intersects(h)) {
                        playSound('hit');
                        deaths++;
                        screenShake = 14;
                        spawnBurst(p1.x + 13, p1.y + 13, p1.color, 20);
                        spawnBurst(p2.x + 13, p2.y + 13, p2.color, 20);
                        p1.x = lvl.p1Start.x; p1.y = lvl.p1Start.y;
                        p2.x = lvl.p2Start.x; p2.y = lvl.p2Start.y;
                        statusEl.innerText = "⚡ ELIMINATED! RESPAWNING...";
                    }
                });

                // Animated Gems
                lvl.gems.forEach(gem => {
                    if (!gem.taken && (p1.intersects(gem) || p2.intersects(gem))) {
                        gem.taken = true;
                        score += 300;
                        playSound('gem');
                        spawnBurst(gem.x, gem.y, "#ffbe0b", 16);
                    }
                });

                // Room Completion
                if (p1.intersects(lvl.exits[0]) && p2.intersects(lvl.exits[1])) {
                    if (currentLevel + 1 < levels.length) {
                        playSound('win');
                        spawnBurst(400, 250, "#00d2ff", 30);
                        loadLevel(currentLevel + 1);
                        statusEl.innerText = `🎉 CLEARED ROOM ${currentLevel}! MOVING TO ROOM ${currentLevel + 1}`;
                    } else {
                        if (!statusEl.innerText.includes("VICTORY")) playSound('win');
                        statusEl.innerText = `🏆 ESCAPED ALL ROOMS! RANK: ${calculateRank()}`;
                    }
                }

                roomNumEl.innerText = currentLevel + 1;
                scoreEl.innerText = score;
                rankEl.innerText = calculateRank();

                if (conn && conn.open) {
                    conn.send({
                        gameState: {
                            currentLevel: currentLevel,
                            p1: { x: p1.x, y: p1.y, facing: p1.facing, walkCycle: p1.walkCycle },
                            p2: { x: p2.x, y: p2.y, facing: p2.facing, walkCycle: p2.walkCycle },
                            doors: lvl.doors, plates: lvl.plates, gems: lvl.gems, hazards: lvl.hazards,
                            score: score, deaths: deaths, status: statusEl.innerText
                        }
                    });
                }
            } else if (myRole === 'p2' && conn && conn.open) {
                conn.send({ inputs: keys });
            }

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
            particles = particles.filter(p => p.life > 0);
            if (screenShake > 0) screenShake--;
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const lvl = levels[currentLevel];

            // Render Animated Pressure Plates
            lvl.plates.forEach(plate => {
                ctx.save();
                ctx.fillStyle = plate.color;
                ctx.globalAlpha = 0.3;
                ctx.fillRect(plate.x - 3, plate.y - 3, plate.w + 6, plate.h + 6);
                ctx.globalAlpha = 1.0;

                const pressOffset = (plate.pressProgress || 0) * 4;
                ctx.fillStyle = plate.active ? "#00ff88" : plate.color;
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = plate.active ? 15 : 5;
                ctx.fillRect(plate.x + pressOffset / 2, plate.y + pressOffset / 2, plate.w - pressOffset, plate.h - pressOffset);
                ctx.restore();
            });

            // Render Animated Sliding Doors
            lvl.doors.forEach(door => {
                ctx.save();
                const visibleH = door.maxH * (1 - (door.slideProgress || 0));
                if (visibleH > 2) {
                    ctx.fillStyle = door.color;
                    ctx.shadowColor = door.color; ctx.shadowBlur = 10;
                    ctx.fillRect(door.x, door.y, door.w, visibleH);
                }
                ctx.restore();
            });

            // Render Walls
            ctx.fillStyle = "#2a344d";
            lvl.walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

            // Render Animated Hazards (Pulsing Energy Rays)
            lvl.hazards.forEach(h => {
                ctx.save();
                ctx.fillStyle = "#ff0055";
                ctx.shadowColor = "#ff0055";
                ctx.shadowBlur = 12 + Math.sin(animTime * 5) * 6;
                ctx.fillRect(h.x, h.y, h.w, h.h);
                ctx.restore();
            });

            // Render Animated 3D Floating Gems
            lvl.gems.forEach(gem => {
                if (!gem.taken) {
                    ctx.save();
                    const floatY = Math.sin(animTime * 3) * 5;
                    const scaleX = Math.cos(animTime * 4);
                    ctx.translate(gem.x, gem.y + floatY);
                    ctx.scale(scaleX, 1);
                    ctx.fillStyle = "#ffbe0b";
                    ctx.shadowColor = "#ffbe0b"; ctx.shadowBlur = 12;

                    ctx.beginPath();
                    ctx.moveTo(0, -10); ctx.lineTo(8, 0); ctx.lineTo(0, 10); ctx.lineTo(-8, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }
            });

            // Render Exit Portals
            lvl.exits.forEach(exit => {
                ctx.save();
                ctx.fillStyle = "#00ff88";
                ctx.shadowColor = "#00ff88"; ctx.shadowBlur = 15 + Math.sin(animTime * 4) * 5;
                ctx.globalAlpha = 0.8;
                ctx.fillRect(exit.x, exit.y, exit.w, exit.h);
                ctx.restore();
            });

            // Render Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            // Render Animated Players
            p1.draw();
            p2.draw();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
