<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - Multi-Room Co-Op</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0b0d12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #lobby {
            background: #141824;
            padding: 28px;
            border-radius: 16px;
            border: 2px solid #232b3e;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,210,255,0.15);
            max-width: 420px;
            width: 90%;
        }
        h1 {
            font-size: 28px;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #00d2ff, #3a86ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .btn {
            background: #00d2ff;
            color: #0b0d12;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            margin: 6px;
            transition: transform 0.1s, background 0.2s;
        }
        .btn:hover { background: #33e0ff; transform: scale(1.03); }
        .btn:active { transform: scale(0.98); }
        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #232b3e;
            background: #0b0d12;
            color: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            width: 80%;
            margin-bottom: 12px;
        }
        #game-container { display: none; flex-direction: column; align-items: center; }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        canvas {
            border: 3px solid #232b3e;
            border-radius: 12px;
            box-shadow: 0px 12px 40px rgba(0, 0, 0, 0.8);
            background-color: #121620;
        }
        #status {
            margin-top: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #ffbe0b;
        }
        .badge { padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        .p1-badge { background: #3a86ff; }
        .p2-badge { background: #ff006e; }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby">
        <h1>TOGETHER: ESCAPE ROOMS</h1>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">4 rooms of escalating co-op puzzle gauntlets!</p>
        
        <button class="btn" onclick="createRoom()">Create Room (Player 1)</button>
        <div style="margin: 14px 0; color: #475569; font-weight: bold;">— OR —</div>
        <input type="text" id="join-code" placeholder="ENTER 4-DIGIT CODE" maxlength="4">
        <button class="btn" style="background:#ff006e; color:#fff;" onclick="joinRoom()">Join Room (Player 2)</button>

        <p id="lobby-status" style="margin-top: 16px; color: #ffbe0b; font-size: 14px;"></p>
    </div>

    <!-- GAME BOARD -->
    <div id="game-container">
        <div id="hud">
            <div><span id="role-badge" class="badge"></span></div>
            <div style="color: #00d2ff;">🏰 ROOM: <span id="room-num">1</span>/4</div>
            <div style="color: #ffbe0b;">💎 TEAM SCORE: <span id="score">0</span></div>
            <div style="color: #a855f7;">🤝 TEAMWORK: <span id="teamwork-rank">A</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="status">Get ready to work together!</div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'gem') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'door') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const lobbyEl = document.getElementById("lobby");
        const gameContainer = document.getElementById("game-container");
        const lobbyStatus = document.getElementById("lobby-status");
        const statusEl = document.getElementById("status");
        const roleBadge = document.getElementById("role-badge");
        const roomNumEl = document.getElementById("room-num");
        const scoreEl = document.getElementById("score");
        const rankEl = document.getElementById("teamwork-rank");

        let peer = null, conn = null, myRole = null;
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.code] = true);
        window.addEventListener("keyup", (e) => keys[e.code] = false);

        let p2Inputs = {};
        let score = 0;
        let deaths = 0;
        let particles = [];
        let screenShake = 0;
        let currentLevel = 0;

        function createRoom() {
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer("together-v4-" + roomCode);

            peer.on('open', () => {
                myRole = 'p1';
                lobbyStatus.innerText = `Room Ready! Code: ${roomCode}`;
            });
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        }

        function joinRoom() {
            const code = document.getElementById("join-code").value.trim();
            if (!code) return alert("Enter code!");

            peer = new Peer();
            peer.on('open', () => {
                myRole = 'p2';
                conn = peer.connect("together-v4-" + code);
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                lobbyEl.style.display = 'none';
                gameContainer.style.display = 'flex';
                
                if (myRole === 'p1') {
                    roleBadge.innerText = "Player 1 (Blue)";
                    roleBadge.className = "badge p1-badge";
                } else {
                    roleBadge.innerText = "Player 2 (Pink)";
                    roleBadge.className = "badge p2-badge";
                }
                loadLevel(0);
                requestAnimationFrame(gameLoop);
            });

            conn.on('data', (data) => {
                if (myRole === 'p2' && data.gameState) syncGameState(data.gameState);
                if (myRole === 'p1' && data.inputs) p2Inputs = data.inputs;
            });
        }

        // 4 ESCAPE ROOMS WITH INCREASING DIFFICULTY
        const levels = [
            // ROOM 1: TUTORIAL
            {
                p1Start: { x: 50, y: 100 }, p2Start: { x: 50, y: 350 },
                walls: [
                    { x: 0, y: 245, w: 800, h: 10 },
                    { x: 380, y: 0, w: 20, h: 170 }, { x: 380, y: 255, w: 20, h: 170 }
                ],
                hazards: [],
                plates: [
                    { x: 220, y: 100, w: 32, h: 32, color: "#3a86ff", targetDoor: 1, active: false },
                    { x: 220, y: 350, w: 32, h: 32, color: "#ff006e", targetDoor: 0, active: false }
                ],
                doors: [
                    { x: 380, y: 170, w: 20, h: 75, color: "#ff006e", open: false },
                    { x: 380, y: 255, w: 20, h: 75, color: "#3a86ff", open: false }
                ],
                gems: [{ x: 150, y: 110, size: 14, taken: false }, { x: 500, y: 350, size: 14, taken: false }],
                exits: [{ x: 720, y: 80, w: 45, h: 80 }, { x: 720, y: 330, w: 45, h: 80 }]
            },
            // ROOM 2: DOUBLE LOCK
            {
                p1Start: { x: 50, y: 80 }, p2Start: { x: 50, y: 330 },
                walls: [
                    { x: 0, y: 245, w: 800, h: 10 },
                    { x: 250, y: 0, w: 20, h: 160 }, { x: 520, y: 80, w: 20, h: 165 },
                    { x: 350, y: 255, w: 20, h: 160 }
                ],
                hazards: [],
                plates: [
                    { x: 140, y: 180, w: 32, h: 32, color: "#3a86ff", targetDoor: 1, active: false },
                    { x: 280, y: 350, w: 32, h: 32, color: "#ff006e", targetDoor: 0, active: false }
                ],
                doors: [
                    { x: 520, y: 0, w: 20, h: 80, color: "#ff006e", open: false },
                    { x: 350, y: 415, w: 20, h: 85, color: "#3a86ff", open: false }
                ],
                gems: [{ x: 320, y: 80, size: 14, taken: false }, { x: 620, y: 350, size: 14, taken: false }],
                exits: [{ x: 720, y: 80, w: 45, h: 80 }, { x: 720, y: 330, w: 45, h: 80 }]
            },
            // ROOM 3: HAZARD DODGE
            {
                p1Start: { x: 40, y: 100 }, p2Start: { x: 40, y: 350 },
                walls: [
                    { x: 0, y: 245, w: 800, h: 10 },
                    { x: 300, y: 0, w: 20, h: 150 }, { x: 550, y: 90, w: 20, h: 155 },
                    { x: 400, y: 255, w: 20, h: 160 }
                ],
                hazards: [
                    { x: 180, y: 30, w: 12, h: 100, vy: 3, minY: 10, maxY: 140 },
                    { x: 450, y: 270, w: 12, h: 100, vy: -3, minY: 260, maxY: 380 }
                ],
                plates: [
                    { x: 200, y: 180, w: 32, h: 32, color: "#3a86ff", targetDoor: 1, active: false },
                    { x: 220, y: 350, w: 32, h: 32, color: "#ff006e", targetDoor: 0, active: false }
                ],
                doors: [
                    { x: 550, y: 0, w: 20, h: 90, color: "#ff006e", open: false },
                    { x: 400, y: 415, w: 20, h: 85, color: "#3a86ff", open: false }
                ],
                gems: [{ x: 400, y: 100, size: 14, taken: false }, { x: 580, y: 350, size: 14, taken: false }],
                exits: [{ x: 720, y: 80, w: 45, h: 80 }, { x: 720, y: 330, w: 45, h: 80 }]
            },
            // ROOM 4: THE GAUNTLET
            {
                p1Start: { x: 40, y: 60 }, p2Start: { x: 40, y: 300 },
                walls: [
                    { x: 0, y: 245, w: 800, h: 10 },
                    { x: 180, y: 0, w: 20, h: 150 }, { x: 380, y: 90, w: 20, h: 155 }, { x: 580, y: 0, w: 20, h: 150 },
                    { x: 280, y: 255, w: 20, h: 160 }, { x: 500, y: 340, w: 20, h: 160 }
                ],
                hazards: [
                    { x: 280, y: 30, w: 12, h: 90, vy: 4, minY: 10, maxY: 140 },
                    { x: 480, y: 30, w: 12, h: 90, vy: -4, minY: 10, maxY: 140 },
                    { x: 380, y: 270, w: 12, h: 90, vy: 4, minY: 260, maxY: 390 }
                ],
                plates: [
                    { x: 100, y: 180, w: 32, h: 32, color: "#3a86ff", targetDoor: 1, active: false },
                    { x: 200, y: 350, w: 32, h: 32, color: "#ff006e", targetDoor: 0, active: false }
                ],
                doors: [
                    { x: 580, y: 150, w: 20, h: 95, color: "#ff006e", open: false },
                    { x: 500, y: 255, w: 20, h: 85, color: "#3a86ff", open: false }
                ],
                gems: [{ x: 280, y: 180, size: 14, taken: false }, { x: 420, y: 350, size: 14, taken: false }, { x: 650, y: 100, size: 14, taken: false }],
                exits: [{ x: 720, y: 80, w: 45, h: 80 }, { x: 720, y: 330, w: 45, h: 80 }]
            }
        ];

        class Player {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.size = 24; this.color = color;
                this.speed = 4;
            }

            move(inputKeys) {
                let dx = 0, dy = 0;
                if (inputKeys["KeyW"] || inputKeys["ArrowUp"]) dy -= this.speed;
                if (inputKeys["KeyS"] || inputKeys["ArrowDown"]) dy += this.speed;
                if (inputKeys["KeyA"] || inputKeys["ArrowLeft"]) dx -= this.speed;
                if (inputKeys["KeyD"] || inputKeys["ArrowRight"]) dx += this.speed;

                this.x += dx;
                if (this.checkCollision()) this.x -= dx;
                this.y += dy;
                if (this.checkCollision()) this.y -= dy;
            }

            checkCollision() {
                const lvl = levels[currentLevel];
                if (this.x < 0 || this.x + this.size > canvas.width || 
                    this.y < 0 || this.y + this.size > canvas.height) return true;

                for (let wall of lvl.walls) if (this.intersects(wall)) return true;
                for (let door of lvl.doors) if (!door.open && this.intersects(door)) return true;
                return false;
            }

            intersects(rect) {
                return this.x < rect.x + (rect.w || rect.size) &&
                       this.x + this.size > rect.x &&
                       this.y < rect.y + (rect.h || rect.size) &&
                       this.y + this.size > rect.y;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.shadowBlur = 0;
            }
        }

        let p1 = new Player(0, 0, "#3a86ff");
        let p2 = new Player(0, 0, "#ff006e");

        function loadLevel(index) {
            currentLevel = index;
            const lvl = levels[currentLevel];
            p1.x = lvl.p1Start.x; p1.y = lvl.p1Start.y;
            p2.x = lvl.p2Start.x; p2.y = lvl.p2Start.y;
            lvl.plates.forEach(p => p.active = false);
            lvl.doors.forEach(d => d.open = false);
            lvl.gems.forEach(g => g.taken = false);
        }

        function calculateRank() {
            if (deaths === 0 && score >= 1500) return "S+ (FLAWLESS)";
            if (deaths <= 2) return "A (GREAT TEAM)";
            if (deaths <= 5) return "B (SOLID)";
            return "C (NEEDS WORK)";
        }

        function addParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: color, life: 15
                });
            }
        }

        function syncGameState(state) {
            currentLevel = state.currentLevel;
            p1.x = state.p1.x; p1.y = state.p1.y;
            p2.x = state.p2.x; p2.y = state.p2.y;
            levels[currentLevel].doors = state.doors;
            levels[currentLevel].plates = state.plates;
            levels[currentLevel].gems = state.gems;
            levels[currentLevel].hazards = state.hazards;
            score = state.score;
            deaths = state.deaths;
            statusEl.innerText = state.status;
            roomNumEl.innerText = currentLevel + 1;
            scoreEl.innerText = score;
            rankEl.innerText = calculateRank();
        }

        function update() {
            if (myRole === 'p1') {
                const lvl = levels[currentLevel];
                p1.move(keys);
                p2.move(p2Inputs);

                // Move Hazards
                lvl.hazards.forEach(h => {
                    h.y += h.vy;
                    if (h.y <= h.minY || h.y >= h.maxY) h.vy *= -1;

                    // Hazard collision check
                    if (p1.intersects(h) || p2.intersects(h)) {
                        playSound('hit');
                        deaths++;
                        screenShake = 10;
                        p1.x = lvl.p1Start.x; p1.y = lvl.p1Start.y;
                        p2.x = lvl.p2Start.x; p2.y = lvl.p2Start.y;
                        statusEl.innerText = "⚡ HIT A HAZARD! ROOM RESET!";
                    }
                });

                // Pressure Plates & Doors
                lvl.plates.forEach((plate) => {
                    const activeNow = p1.intersects(plate) || p2.intersects(plate);
                    if (activeNow && !plate.active) {
                        playSound('door');
                        screenShake = 5;
                        addParticles(plate.x + 16, plate.y + 16, plate.color);
                    }
                    plate.active = activeNow;
                    lvl.doors[plate.targetDoor].open = plate.active;
                });

                // Gem Pickups
                lvl.gems.forEach(gem => {
                    if (!gem.taken && (p1.intersects(gem) || p2.intersects(gem))) {
                        gem.taken = true;
                        score += 300;
                        playSound('gem');
                        addParticles(gem.x, gem.y, "#ffbe0b");
                    }
                });

                // Progression
                if (p1.intersects(lvl.exits[0]) && p2.intersects(lvl.exits[1])) {
                    if (currentLevel + 1 < levels.length) {
                        playSound('win');
                        loadLevel(currentLevel + 1);
                        statusEl.innerText = `🎉 CLEARED ROOM ${currentLevel}! ENTERING ROOM ${currentLevel + 1}...`;
                    } else {
                        if (!statusEl.innerText.includes("VICTORY")) {
                            playSound('win');
                        }
                        statusEl.innerText = `🏆 VICTORY! ALL 4 ESCAPE ROOMS CLEARED! RANK: ${calculateRank()}`;
                    }
                }

                roomNumEl.innerText = currentLevel + 1;
                scoreEl.innerText = score;
                rankEl.innerText = calculateRank();

                if (conn && conn.open) {
                    conn.send({
                        gameState: {
                            currentLevel: currentLevel,
                            p1: { x: p1.x, y: p1.y }, p2: { x: p2.x, y: p2.y },
                            doors: lvl.doors, plates: lvl.plates, gems: lvl.gems, hazards: lvl.hazards,
                            score: score, deaths: deaths, status: statusEl.innerText
                        }
                    });
                }
            } else if (myRole === 'p2' && conn && conn.open) {
                conn.send({ inputs: keys });
            }

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
            particles = particles.filter(p => p.life > 0);
            if (screenShake > 0) screenShake--;
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const lvl = levels[currentLevel];

            // Plates
            lvl.plates.forEach(plate => {
                ctx.fillStyle = plate.active ? "#80b918" : plate.color;
                ctx.globalAlpha = plate.active ? 0.9 : 0.4;
                ctx.fillRect(plate.x, plate.y, plate.w, plate.h);
                ctx.globalAlpha = 1.0;
            });

            // Doors
            lvl.doors.forEach(door => {
                if (!door.open) {
                    ctx.fillStyle = door.color;
                    ctx.fillRect(door.x, door.y, door.w, door.h);
                }
            });

            // Walls
            ctx.fillStyle = "#232b3e";
            lvl.walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

            // Moving Hazards
            ctx.fillStyle = "#ef4444";
            ctx.shadowColor = "#ef4444"; ctx.shadowBlur = 8;
            lvl.hazards.forEach(h => ctx.fillRect(h.x, h.y, h.w, h.h));
            ctx.shadowBlur = 0;

            // Gems
            lvl.gems.forEach(gem => {
                if (!gem.taken) {
                    ctx.fillStyle = "#ffbe0b";
                    ctx.beginPath();
                    ctx.arc(gem.x, gem.y, gem.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Exits
            lvl.exits.forEach(exit => {
                ctx.fillStyle = "#52b788";
                ctx.shadowColor = "#52b788"; ctx.shadowBlur = 10;
                ctx.fillRect(exit.x, exit.y, exit.w, exit.h);
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
            });

            // Players
            p1.draw();
            p2.draw();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
