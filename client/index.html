<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Together 3D - Open World Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .interactive {
      pointer-events: auto;
    }
    #lobby-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(16, 20, 32, 0.95);
      border: 2px solid #232d42;
      padding: 32px;
      border-radius: 16px;
      text-align: center;
      width: 340px;
      box-shadow: 0 10px 40px rgba(0, 210, 255, 0.2);
    }
    h1 {
      font-size: 26px;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #00d2ff, #3a86ff, #ff006e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #232d42;
      background: #0a0d14;
      color: #ffffff;
      text-align: center;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #00d2ff;
    }
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #00d2ff;
      color: #000000;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #33e0ff;
      transform: scale(1.02);
    }
    .btn-secondary {
      background: #ff006e;
      color: #ffffff;
    }
    .btn-secondary:hover {
      background: #ff2a85;
    }
    #hud {
      display: none;
      padding: 20px;
      justify-content: space-between;
      font-weight: bold;
    }
    #room-display {
      background: rgba(10, 13, 20, 0.8);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #232d42;
    }
  </style>

  <!-- External Libraries -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 3D Canvas Mounting Area -->
  <div id="canvas-container"></div>

  <!-- Interactive UI Overlay -->
  <div id="ui-overlay">
    <div id="lobby-card" class="interactive">
      <h1>TOGETHER 3D</h1>
      <input type="text" id="username" placeholder="Display Name" maxlength="12">
      <button class="btn" onclick="createRoom()">Create New World</button>
      
      <div style="margin: 14px 0 8px 0; font-size: 12px; color: #666666; letter-spacing: 1px;">OR JOIN EXISTING</div>
      
      <input type="text" id="room-input" placeholder="4-Digit Code" maxlength="4">
      <button class="btn btn-secondary" onclick="joinRoom()">Join World</button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud">
      <div id="room-display">Room: <span id="current-room-code">----</span></div>
    </div>
  </div>

  <!-- Game Logic -->
  <script src="main.js"></script>
</body>
</html>
